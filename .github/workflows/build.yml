name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        zig-version: ['0.16.0', '0.17.0']
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ matrix.zig-version }}
      - run: zig fmt --check .
      - run: zig build test --summary all
      - run: zig build conformance
      # The string scans depend on how a bool vector maps to an integer,
      # which differs on big-endian targets.
      - name: Test on big-endian (s390x)
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user-static
          zig build test -Dtarget=s390x-linux -fqemu --summary all
